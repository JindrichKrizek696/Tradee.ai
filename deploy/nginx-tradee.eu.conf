# Tradee na tradee.eu: celá aplikace (i /assets s daty) za auth_request; veřejné jsou jen login, waitlist a landing.
limit_req_zone $binary_remote_addr zone=tradee_waitlist:1m rate=1r/m;
limit_req_zone $binary_remote_addr zone=tradee_mt:1m rate=120r/m;

server {
    listen 443 ssl;
    server_name tradee.eu;
    ssl_certificate /etc/letsencrypt/live/tradee.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradee.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /auth/check {
        internal;
        include snippets/tradee-proxy.conf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8787;
    }
    location /auth/ {
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /api/waitlist {
        limit_req zone=tradee_waitlist burst=4 nodelay;
        limit_req_status 429;
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
    location /landing/ {
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /soukromi {
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787/landing/soukromi;
    }
    location = /favicon.svg {
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /favicon.ico {
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
    # PWA: manifest a ikony si prohlížeč stahuje bez cookie
    location ~ ^/(manifest\.webmanifest|icon-192\.png|icon-512\.png|apple-touch-icon\.png)$ {
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
    # EA TradeeSync: bez cookie, ověřuje klíč v hlavičce Authorization (snippet ji maže → nastavit znovu)
    location = /api/mt/ingest {
        limit_req zone=tradee_mt burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        include snippets/tradee-proxy.conf;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /api/mt/state {
        limit_req zone=tradee_mt burst=60 nodelay;
        limit_req_status 429;
        include snippets/tradee-proxy.conf;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8787;
    }
    location / {
        auth_request /auth/check;
        error_page 401 = @unauth;
        include snippets/tradee-proxy.conf;
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8787;
    }
    # Nepřihlášený: "/" → landing, API → 401, ostatní → zpět na "/".
    # default_type jen pro JSON 401 (v if ho nelze nastavit); landing z wrangleru posílá vlastní text/html, takže ho to nepřebije.
    location @unauth {
        default_type application/json;
        if ($uri = /) { rewrite ^ /landing/ break; }
        if ($uri ~ ^/api/) { return 401 '{"error":"Pro tuto akci se přihlas."}'; }
        return 302 /;
        include snippets/tradee-proxy.conf;
        proxy_pass http://127.0.0.1:8787;
    }
}
server {
    listen 443 ssl;
    server_name www.tradee.eu;
    ssl_certificate /etc/letsencrypt/live/tradee.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradee.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://tradee.eu$request_uri;
}
server {
    listen 80;
    server_name tradee.eu www.tradee.eu;
    return 301 https://tradee.eu$request_uri;
}
